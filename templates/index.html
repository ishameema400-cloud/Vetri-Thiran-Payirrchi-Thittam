<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Story Creator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80(https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80)') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container {
            background: #ffffff;
            border-radius: 12px;
            padding: 35px 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 26px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            font-size: 14px;
        }
        textarea, input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f8fafc;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: #0284c7;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>✏️ Create Your Comic</h1>
        <form action="/generate" method="POST">
            <div class="form-group">
                <label for="prompt">Story Prompt:</label>
                <textarea id="prompt" name="prompt" rows="3" required placeholder="A brave fox explores an enchanted forest."></textarea>
            </div>
            
            <div class="form-group">
                <label for="character_name">Main Character Name:</label>
                <input type="text" id="character_name" name="character_name" value="Free" required>
            </div>

            <div class="form-group">
                <label for="setting">Setting:</label>
                <select id="setting" name="setting">
                    <option value="Forest">Forest</option>
                    <option value="School">School</option>
                    <option value="Space">Space</option>
                    <option value="City">City</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tone">Story Tone:</label>
                <select id="tone" name="tone">
                    <option value="Dramatic">Dramatic</option>
                    <option value="Light-hearted">Light-hearted</option>
                    <option value="Poetic">Poetic</option>
                    <option value="Funny">Funny</option>
                </select>
            </div>

            <div class="form-group">
                <label for="style">Art Style:</label>
                <select id="style" name="style">
                    <option value="Realistic">Realistic</option>
                    <option value="Anime">Anime</option>
                    <option value="Pixel Art">Pixel Art</option>
                    <option value="Comic Book">Comic Book</option>
                </select>
            </div>

            <button type="submit">Generate Comic</button>
        </form>
    </div>
</body>
</html>
