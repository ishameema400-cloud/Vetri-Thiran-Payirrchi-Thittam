<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Comic Preview - ComicCraft</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1e293b;
        }
        .panel-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .panel-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #0f172a;
        }
        .panel-image {
            width: 100%;
            max-width: 512px;
            height: auto;
            border-radius: 6px;
            display: block;
            margin-bottom: 15px;
        }
        .scene-desc {
            font-style: italic;
            color: #64748b;
            margin-bottom: 10px;
        }
        .story-text {
            color: #334155;
            white-space: pre-line;
            line-height: 1.6;
        }
        .download-btn {
            display: block;
            width: 260px;
            margin: 30px auto;
            padding: 14px 20px;
            background-color: #0284c7;
            color: white;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }
        .download-btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Your Comic Preview</h1>

        {% for panel in layout %}
        <div class="panel-card">
            <div class="panel-title">Panel {{ panel.panel }}: {{ panel.title }}</div>
            <img class="panel-image" src="{{ panel.image_path }}" alt="Panel {{ panel.panel }}">
            {% if panel.scene_description %}
            <div class="scene-desc">{{ panel.scene_description }}</div>
            {% endif %}
            <div class="story-text">{{ panel.text }}</div>
        </div>
        {% endfor %}

        <a class="download-btn" href="/export-success?pdf_path={{ pdf_path }}">
            📥 Download Your Comic as PDF
        </a>
    </div>
</body>
</html>
